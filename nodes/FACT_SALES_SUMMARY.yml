        join:
          joinCondition: "FROM {{ ref('ALCOBEV', 'STG_PRIMARY_SALES_ACTUALS') }} AS\
            \ psa\nLEFT JOIN {{ ref('ALCOBEV', 'DIM_COMPANYMASTER') }} AS dim_company\
            \ ON psa.COMPANYCODE = dim_company.COMPANYCODE\nLEFT JOIN {{ ref('ALCOBEV',\
            \ 'DIM_GEOGRAPHYMASTER') }} AS dim_geo ON psa.STATECODE = dim_geo.STATECODE\n\
            LEFT JOIN {{ ref('ALCOBEV', 'DIM_PRODUCTMASTER') }} AS dim_prod ON psa.SKUCODE\
            \ = dim_prod.SKUCODE\nLEFT JOIN {{ ref('ALCOBEV', 'STG_PRIMARY_SALES_PLAN_AOP')\
            \ }} AS psp ON psa.STATECODE = psp.STATECODE AND psa.SKUCODE = psp.SKUCODE\n\
            LEFT JOIN {{ ref('ALCOBEV', 'DIM_OUTLETMASTER') }} AS dim_outlet ON psa.CUSTOMERCODE\
            \ = dim_outlet.OUTLET_CODE\nLEFT JOIN {{ ref('ALCOBEV', 'LATEST_ACTIVATION_DATE')\
            \ }} as amr ON psa.SKUCODE = amr.PRODUCTLEVELCODE\nLEFT JOIN {{ ref('ALCOBEV',\
            \ 'DIM_ACTIVATIONMASTER') }} as dim_act ON psa.SKUCODE = dim_act.PRODUCTLEVELCODE\
            \ AND dim_act.EFFECTIVEFROM = amr.LATEST_EFFECTIVEFROM\nGROUP BY \n  psa.COMPANYCODE,\n\
            \  dim_company.COMPANYNAME,\n   psa.STATECODE,\n   dim_geo.STATENAME,\n\
            \   psa.SKUCODE,\n   dim_prod.ITEMNAME,\n   dim_outlet.ACTIVE_FLAG,\n \
            \  dim_act.PROMOTION_DESC,\n   dim_act.EFFECTIVE_DATE_RANGE_START,\n  \
            \ dim_act.EFFECTIVE_DATE_RANGE_END"
